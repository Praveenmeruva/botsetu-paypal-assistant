<!doctype html><html><head><meta charset="utf-8"><title>Owner dashboard · BotSetu</title>
<style>body{font-family:system-ui;margin:24px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left;font-size:14px}.PAID{color:green;font-weight:700}.PENDING_PAYMENT{color:#b70}</style></head>
<body><h2>Bookings & PayPal payments</h2><p id="sum"></p><table><thead><tr><th>ID</th><th>Business</th><th>Customer</th><th>Service</th><th>When</th><th>Amount</th><th>Status</th><th>PayPal order</th><th>Capture</th></tr></thead><tbody id="rows"></tbody></table>
<script>
async function load(){const b=await fetch('/api/bookings').then(r=>r.json());
const paid=b.filter(x=>x.status==='PAID');document.getElementById('sum').textContent=`${b.length} bookings · ${paid.length} paid · collected ${paid.reduce((a,x)=>a+x.amount,0).toFixed(2)} ${b[0]?b[0].currency:''}`;
document.getElementById('rows').innerHTML=b.map(x=>`<tr><td>${x.id}</td><td>${x.business}</td><td>${x.customer}</td><td>${x.service}</td><td>${x.date} ${x.slot}</td><td>${x.amount} ${x.currency}</td><td class="${x.status}">${x.status}</td><td>${x.orderId||''}</td><td>${x.captureId||''}</td></tr>`).join('');}
load();setInterval(load,3000);
</script></body></html>
